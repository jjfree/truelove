name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  market_fetch:
    if: github.ref == 'refs/heads/market-live-fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-live-fetch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market request
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          req=json.load(open('data/market-fetch-request.json',encoding='utf-8'))
          url=req['url']
          if req.get('params'):
              url += ('&' if '?' in url else '?') + urllib.parse.urlencode(req['params'])
          body=None
          headers={'User-Agent':'Mozilla/5.0 GitHubActions market-live-fetch'}
          if req.get('method','GET').upper()=='POST':
              if req.get('json') is not None:
                  body=json.dumps(req['json']).encode(); headers['Content-Type']='application/json'
              elif req.get('data') is not None:
                  body=urllib.parse.urlencode(req['data']).encode(); headers['Content-Type']='application/x-www-form-urlencoded'
          request=urllib.request.Request(url,data=body,headers=headers,method=req.get('method','GET').upper())
          try:
              with urllib.request.urlopen(request,timeout=req.get('timeout_seconds',30)) as r:
                  raw=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get('content-type')
          except Exception as e:
              out={'request_id':req['request_id'],'source':req['url'],'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'validation':{'passed':False,'failures':[repr(e)]},'body_text':''}
              open('data/market-fetch-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)); raise
          txt=raw.decode('utf-8','replace')
          failures=[]
          for s in req.get('expect',{}).get('contains',[]):
              if s not in txt: failures.append('missing:'+s)
          if len(raw)<req.get('expect',{}).get('min_bytes',0): failures.append('too_short')
          out={'request_id':req['request_id'],'source':req['url'],'final_url':final,'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status_code':status,'content_type':ctype,'content_length':len(raw),'validation':{'passed':200<=status<300 and not failures,'failures':failures},'body_text':txt[:900000]}
          open('data/market-fetch-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist fetch result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-fetch-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market live fetch result"
            git push origin HEAD:market-live-fetch
          fi

  verify:
    if: github.ref != 'refs/heads/market-live-fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

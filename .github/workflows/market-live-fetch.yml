name: Market live fetch

on:
  push:
    branches:
      - market-live-fetch
    paths:
      - data/market-fetch-request.json
      - .github/workflows/market-live-fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-live-fetch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: |
          python - <<'PY'
          import json, requests, datetime
          p='data/market-fetch-request.json'
          req=json.load(open(p,encoding='utf-8'))
          r=requests.request(req.get('method','GET'), req['url'], params=req.get('params'), data=req.get('data'), json=req.get('json'), timeout=req.get('timeout_seconds',30), headers={'User-Agent':'Mozilla/5.0 GitHubActions market-live-fetch'})
          txt=r.text
          exp=req.get('expect',{})
          failures=[]
          for s in exp.get('contains',[]):
              if s not in txt: failures.append('missing:'+s)
          if len(r.content) < exp.get('min_bytes',0): failures.append('too_short')
          out={'request_id':req['request_id'],'source':req['url'],'final_url':r.url,'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status_code':r.status_code,'content_type':r.headers.get('content-type'),'validation':{'passed':r.ok and not failures,'failures':failures},'body_text':txt[:500000]}
          open('data/market-fetch-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['validation']['passed']:
              raise SystemExit(json.dumps(out['validation'],ensure_ascii=False))
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-fetch-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market live fetch result"
            git push origin HEAD:market-live-fetch
          fi
